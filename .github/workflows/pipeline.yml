name: Pipeline START Vendor Analytics

on:
  schedule:
    # Horarios em UTC. Brasil = UTC-3 o ano todo (sem horario de verao desde 2019).
    # Rodada leve (so pedidos novos + email) em .github/workflows/pedidos_rapido.yml, as 03:10 BRT.
    # Minuto :17 de proposito: na hora cheia (:00) o agendador do GitHub fica
    # congestionado e atrasava as rodadas em 3 a 7 horas.
    - cron: '17 7 * * *'   # 04:17 BRT
    - cron: '17 21 * * *'  # 18:17 BRT
  workflow_dispatch:      # permite rodar manualmente pela aba Actions do GitHub
    inputs:
      preview_conta:
        description: 'Opcional: chave da conta (ex. ozitp) para so mandar o email de PREVIA com pedidos reais, sem rodar o pipeline inteiro'
        required: false
        type: string

permissions:
  contents: write  # o publicar_github.py e o notificar_pedidos.py fazem commit + push

concurrency:
  group: pipeline-start-vendor-analytics
  cancel-in-progress: false  # nunca cancela uma rodada no meio (evita commit pela metade)

jobs:
  rodar_tudo:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # viradas de mes pedem relatorio novo pra TODAS as contas de uma vez (pode passar de 1h)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true  # necessario pro git push dentro do pipeline

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala dependencias
        run: pip install -r requirements.txt

      - name: Configura identidade do git (para os commits automaticos)
        run: |
          git config --global user.email "pipeline@startgrupo.com"
          git config --global user.name "START Vendor Analytics (pipeline)"

      - name: Roda o pipeline completo (captura + transforma + notifica + publica)
        if: ${{ github.event.inputs.preview_conta == '' }}
        env:
          SP_API_LWA_CLIENT_ID: ${{ secrets.SP_API_LWA_CLIENT_ID }}
          SP_API_LWA_CLIENT_SECRET: ${{ secrets.SP_API_LWA_CLIENT_SECRET }}
          SP_API_MARKETPLACE_ID: A2Q3Y263D00KWC
          SP_API_REGION: NA
          SP_API_REFRESH_TOKEN_ALFAJF: ${{ secrets.SP_API_REFRESH_TOKEN_ALFAJF }}
          SP_API_REFRESH_TOKEN_BALBOA: ${{ secrets.SP_API_REFRESH_TOKEN_BALBOA }}
          SP_API_REFRESH_TOKEN_BLIDSHOP: ${{ secrets.SP_API_REFRESH_TOKEN_BLIDSHOP }}
          SP_API_REFRESH_TOKEN_JOLITEX: ${{ secrets.SP_API_REFRESH_TOKEN_JOLITEX }}
          SP_API_REFRESH_TOKEN_OZITP: ${{ secrets.SP_API_REFRESH_TOKEN_OZITP }}
          SP_API_REFRESH_TOKEN_PETCLEAN: ${{ secrets.SP_API_REFRESH_TOKEN_PETCLEAN }}
          SP_API_REFRESH_TOKEN_RIOMASTER: ${{ secrets.SP_API_REFRESH_TOKEN_RIOMASTER }}
          SP_API_REFRESH_TOKEN_PLASTPET: ${{ secrets.SP_API_REFRESH_TOKEN_PLASTPET }}
          SP_API_REFRESH_TOKEN_WIWU: ${{ secrets.SP_API_REFRESH_TOKEN_WIWU }}
          SP_API_REFRESH_TOKEN_PETIKO: ${{ secrets.SP_API_REFRESH_TOKEN_PETIKO }}
          SP_API_REFRESH_TOKEN_NEWPET: ${{ secrets.SP_API_REFRESH_TOKEN_NEWPET }}
          SP_API_LWA_CLIENT_ID_APP2: ${{ secrets.SP_API_LWA_CLIENT_ID_APP2 }}
          SP_API_LWA_CLIENT_SECRET_APP2: ${{ secrets.SP_API_LWA_CLIENT_SECRET_APP2 }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/rodar_tudo.py

      - name: So manda o email de previa (nao roda captura nem publica)
        if: ${{ github.event.inputs.preview_conta != '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/notificar_pedidos.py --preview "${{ github.event.inputs.preview_conta }}"
