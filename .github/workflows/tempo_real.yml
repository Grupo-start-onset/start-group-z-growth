name: Tempo real (hora a hora)

on:
  schedule:
    # Horarios em UTC. Brasil = UTC-3 o ano todo. 4x/dia (sugestao do proprio
    # script), espalhados ao longo do dia e fora dos horarios do pipeline
    # completo (04:17 e 18:17 BRT), pra nao competir por quota da API.
    # Minuto :17 de proposito: na hora cheia (:00) o agendador do GitHub fica
    # congestionado e atrasava as rodadas em 3 a 7 horas.
    - cron: '17 10 * * *'  # 07:17 BRT
    - cron: '17 14 * * *'  # 11:17 BRT
    - cron: '17 18 * * *'  # 15:17 BRT
    - cron: '17 22 * * *'  # 19:17 BRT
  workflow_dispatch: {}

permissions:
  contents: write  # publica a pasta tempo_real/ direto (commit + push)

concurrency:
  group: tempo-real-start-vendor-analytics
  cancel-in-progress: false

jobs:
  capturar_tempo_real:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala dependencias
        run: pip install -r requirements.txt

      - name: Captura e publica tempo real
        env:
          SP_API_LWA_CLIENT_ID: ${{ secrets.SP_API_LWA_CLIENT_ID }}
          SP_API_LWA_CLIENT_SECRET: ${{ secrets.SP_API_LWA_CLIENT_SECRET }}
          SP_API_MARKETPLACE_ID: A2Q3Y263D00KWC
          SP_API_REGION: NA
          SP_API_REFRESH_TOKEN_ALFAJF: ${{ secrets.SP_API_REFRESH_TOKEN_ALFAJF }}
          SP_API_REFRESH_TOKEN_BALBOA: ${{ secrets.SP_API_REFRESH_TOKEN_BALBOA }}
          SP_API_REFRESH_TOKEN_BLIDSHOP: ${{ secrets.SP_API_REFRESH_TOKEN_BLIDSHOP }}
          SP_API_REFRESH_TOKEN_JOLITEX: ${{ secrets.SP_API_REFRESH_TOKEN_JOLITEX }}
          SP_API_REFRESH_TOKEN_OZITP: ${{ secrets.SP_API_REFRESH_TOKEN_OZITP }}
          SP_API_REFRESH_TOKEN_PETCLEAN: ${{ secrets.SP_API_REFRESH_TOKEN_PETCLEAN }}
          SP_API_REFRESH_TOKEN_RIOMASTER: ${{ secrets.SP_API_REFRESH_TOKEN_RIOMASTER }}
          SP_API_REFRESH_TOKEN_PLASTPET: ${{ secrets.SP_API_REFRESH_TOKEN_PLASTPET }}
          SP_API_REFRESH_TOKEN_WIWU: ${{ secrets.SP_API_REFRESH_TOKEN_WIWU }}
          SP_API_REFRESH_TOKEN_PETIKO: ${{ secrets.SP_API_REFRESH_TOKEN_PETIKO }}
          SP_API_REFRESH_TOKEN_NEWPET: ${{ secrets.SP_API_REFRESH_TOKEN_NEWPET }}
          SP_API_LWA_CLIENT_ID_APP2: ${{ secrets.SP_API_LWA_CLIENT_ID_APP2 }}
          SP_API_LWA_CLIENT_SECRET_APP2: ${{ secrets.SP_API_LWA_CLIENT_SECRET_APP2 }}
        run: python -u scripts/capturar_tempo_real.py
